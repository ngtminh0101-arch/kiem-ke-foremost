<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
  /* Bố cục theo bộ thiết kế FOREMOST VN: máy tính có thanh bên + thanh tiêu đề + bảng đếm; điện thoại có thẻ đếm bằng ngón cái và tab dưới. Một màu nhấn vàng đồng duy nhất. */
  :root {
    --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", "Malgun Gothic", sans-serif;
    --bg: #fbfbf9; --surface: #ffffff; --surface2: #f5f5f3; --sunk: #f5f5f3;

    --head-top: #faf8f4; --head-bottom: #f4f1ea; --btn-bottom: #f9f8f5; --group-row: #f7f5f0; --group-ink: #1c1b19;
    --accent: #8a6a1f; --accent-mark: #b8892f; --accent-soft: #f6efd9; --accent-soft-line: #d7c79c; --on-accent: #1b1508;
    --in-bg: #edf8f1; --in-ink: #145c3a; --in-line: #a9d4bc; --in-sub: #f4fbf7; --in-cell: #fafdfb;
    --out-bg: #fdf5e2; --out-ink: #7a5410; --out-line: #dec48a; --out-sub: #fefaf0; --out-cell: #fffdf7;
    --cell-input: #eef0f2; --cell-input-line: #c4c9d0;
    --note-bg: #f6ecd3; --note-ink: #5e4510;
    --ok: #1d7a4b; --ok-soft: #edf8f1; --warn: #b08a4a; --warn-soft: #fdf5e2; --bad: #b42318; --bad-soft: #fdecea; --bad-row: #fffafa;
    --total-rule: #1c1c1a; --table-bg: #ffffff; --table-ink: #1c1b19;
    --sh-btn: inset 0 1px 0 #ffffff, 0 1px 1px rgba(40,32,15,.10), 0 2px 5px -1px rgba(40,32,15,.12);
    --sh-primary: inset 0 1px 0 rgba(255,255,255,.4), 0 1px 1px rgba(80,55,10,.25), 0 6px 14px -6px rgba(184,137,47,.55);
    --sh-panel: 0 1px 2px rgba(40,32,15,.06), 0 10px 26px -14px rgba(40,32,15,.22);
    --sh-header: 0 1px 0 #ffffff, 0 8px 22px -16px rgba(40,32,15,.35);
    --sh-side: 6px 0 20px -18px rgba(40,32,15,.35);

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0f11; --surface: #16171a; --surface2: #1b1c20; --sunk: #1b1c20;
      --fg: #ececee; --ink2: #c9cacf; --mute: #8b8d94;
      --line: #2a2c31; --line-strong: #383b43; --line-shade: #1e2025;
      --head-top: #22242a; --head-bottom: #1c1d22; --btn-bottom: #1b1c21; --group-row: #aeaeae; --group-ink: #16171a;
      --accent-soft: #2e2410; --accent-soft-line: #5c4719;
      --in-bg: #11291f; --in-ink: #9af0c3; --in-line: #2a5a43; --in-sub: #11291f; --in-cell: #c4c4c4;
      --out-bg: #2e2410; --out-ink: #ffd889; --out-line: #5c4719; --out-sub: #2e2410; --out-cell: #c4c4c4;
      --cell-input: #e4e4e4; --cell-input-line: #8e8e8e;
      --note-bg: #16171a; --note-ink: #d7d8dc;
      --ok: #5fd09a; --ok-soft: #11291f; --warn: #e7b94d; --warn-soft: #2e2410; --bad: #ff8c82; --bad-soft: #3a1b19; --bad-row: #c9b9b9;
      --total-rule: #a6a6a6; --table-bg: #bcbcbc; --table-ink: #16171a;
      --sh-btn: inset 0 1px 0 rgba(255,255,255,.05), 0 1px 1px rgba(0,0,0,.4);
      --sh-panel: 0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.6);
      --sh-header: 0 8px 22px -16px rgba(0,0,0,.7); --sh-side: 6px 0 20px -18px rgba(0,0,0,.7);
      --sh-nav: inset 0 1px 0 rgba(255,255,255,.05), 0 2px 3px rgba(0,0,0,.4);

    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0f11; --surface: #16171a; --surface2: #1b1c20; --sunk: #1b1c20;
    --fg: #ececee; --ink2: #c9cacf; --mute: #8b8d94;
    --line: #2a2c31; --line-strong: #383b43; --line-shade: #1e2025;
    --head-top: #22242a; --head-bottom: #1c1d22; --btn-bottom: #1b1c21; --group-row: #aeaeae; --group-ink: #16171a;

    --note-bg: #16171a; --note-ink: #d7d8dc;
    --ok: #5fd09a; --ok-soft: #11291f; --warn: #e7b94d; --warn-soft: #2e2410; --bad: #ff8c82; --bad-soft: #3a1b19; --bad-row: #c9b9b9;
    --total-rule: #a6a6a6; --table-bg: #bcbcbc; --table-ink: #16171a;
    --sh-btn: inset 0 1px 0 rgba(255,255,255,.05), 0 1px 1px rgba(0,0,0,.4);
    --sh-panel: 0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.6);
    --sh-header: 0 8px 22px -16px rgba(0,0,0,.7); --sh-side: 6px 0 20px -18px rgba(0,0,0,.7);
    --sh-nav: inset 0 1px 0 rgba(255,255,255,.05), 0 2px 3px rgba(0,0,0,.4);
    --sh-field: inset 0 1px 2px rgba(0,0,0,.3);

  }
  * { box-sizing: border-box; }

  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  [hidden] { display: none !important; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* khung */
  .app { display: flex; min-height: 100vh; min-height: 100dvh; }
  .side { display: none; }
  .mainc { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .top { position: sticky; top: 0; z-index: 20; min-height: 47px; display: flex; align-items: center; gap: 10px; padding: 6px max(12px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: var(--sh-header); }
  .brand { flex: 1; min-width: 0; }
  .brand .l1 { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand .ttl { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand .vr { width: 1px; height: 14px; background: var(--line-strong); flex: none; }
  .brand .co { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand .dsk { display: none; }
  @media (min-width: 861px) { .brand .dsk { display: inline; } }
  .brand .who { font-size: 11px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink2); white-space: nowrap; }
  .sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--mute); flex: none; }
  .sync.ok::before { background: var(--ok); } .sync.busy::before { background: var(--warn); } .sync.err::before { background: var(--bad); }
  @media (max-width: 560px) { .brand .vr, .brand .co { display: none; } .sync { font-size: 0; gap: 0; } #btnSwitch { padding: 0 10px; } }
  .iconbtn { width: 32px; height: 32px; display: grid; place-items: center; padding: 0; flex: none; }
  .iconbtn svg.i { width: 16px; height: 16px; }
  .content { width: 100%; max-width: 1240px; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 96px max(16px, env(safe-area-inset-left, 0px)); }
  .pagehead { margin-bottom: 12px; }
  .eyebrow { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); font-weight: 600; }
  h1 { margin: 0; font-size: 20px; line-height: 24px; font-weight: 600; letter-spacing: -.2px; text-wrap: balance; }
  h2 { font-weight: 600; }

  /* tab dưới (điện thoại) */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: calc(60px + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--surface); border-top: 1px solid var(--line); }
  .tabs button { position: relative; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--mute); font-size: 11.5px; font-weight: 500; min-height: 44px; }
  .tabs button svg.i { width: 20px; height: 20px; }
  .tabs button[aria-selected="true"] { color: var(--accent); font-weight: 600; }
  .tabs button[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 2px 2px; background: var(--accent-mark); }

  /* thanh bên (máy tính) */
  @media (min-width: 861px) {
    .side { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; width: 232px; flex: none; padding: 12px 10px; background: var(--surface); border-right: 1px solid var(--line); box-shadow: var(--sh-side); z-index: 25; }
    .tabs { display: none; }
    #btnSwitch { display: none; }
    .top { padding-inline: 16px; }
    .content { padding: 16px 16px 48px; }
  }
  .side .logo { display: flex; align-items: center; gap: 8px; padding: 4px 8px 0; font-weight: 700; font-size: 13px; letter-spacing: .04em; }
  .side .logo i { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(#ddb66c, #c79b4d); box-shadow: var(--sh-primary); flex: none; }
  .navsec { display: flex; flex-direction: column; gap: 2px; }
  .navsec .hd { font-size: 12px; font-weight: 700; padding: 4px 8px; }
  .nav { position: relative; display: flex; align-items: center; gap: 10px; padding: 6px 10px; min-height: 34px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--ink2); font-size: 13px; font-weight: 500; text-align: left; width: 100%; }
  .nav svg.i { color: var(--mute); }
  .nav:hover { background: var(--sunk); }
  .nav .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav .sub { font-size: 11px; color: var(--mute); font-weight: 500; }
  .nav .lk { width: 14px; height: 14px; color: var(--mute); }
  .nav.cur, .nav[aria-selected="true"] { border-color: var(--line-strong); background: linear-gradient(var(--surface), var(--head-bottom)); box-shadow: var(--sh-nav); color: var(--fg); font-weight: 600; }
  .nav.cur::before, .nav[aria-selected="true"]::before { content: ""; position: absolute; left: -1px; top: 7px; bottom: 7px; width: 3px; border-radius: 2px; background: var(--accent-mark); }
  .nav.cur svg.i, .nav[aria-selected="true"] svg.i { color: var(--accent); }

  /* khối, nút, ô nhập */
  .notice { padding: 6px 10px; border-radius: 5px; margin-bottom: 12px; background: var(--note-bg); color: var(--note-ink); font-size: 12.5px; border: 1px solid transparent; }
  :root[data-theme="dark"] .notice { border-color: var(--line-strong); }
  .notice.bad { background: var(--bad-soft); color: var(--bad); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; box-shadow: var(--sh-panel); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--mute); } .small { font-size: 12.5px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-strong); border-bottom-color: var(--line-shade); background: linear-gradient(var(--surface), var(--btn-bottom)); box-shadow: var(--sh-btn); padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--ink2); min-height: 44px; white-space: nowrap; }
  .btn:hover { border-color: var(--line-shade); }
  .btn.pri, .btn.ok { border-color: #b8892f; border-bottom-color: #9c7425; background: linear-gradient(#ddb66c, #c79b4d); box-shadow: var(--sh-primary); color: #1b1508; font-weight: 600; }
  .btn.danger { color: var(--bad); }
  .btn:disabled { opacity: .5; cursor: default; }
  @media (min-width: 861px) { .btn { min-height: 32px; font-size: 12.5px; } .card .btn, .toolbar .btn { min-height: 28px; } }
  .seg { display: flex; gap: 3px; padding: 3px; background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; margin: 0 0 10px; }
  .seg button { flex: 1; border: 1px solid transparent; background: transparent; padding: 0 8px; border-radius: 8px; font-size: 12.5px; font-weight: 500; color: var(--ink2); min-height: 40px; line-height: 1.25; }
  .seg button .small { color: var(--mute); font-size: 12px; }
  .seg button[aria-selected="true"] { border-color: var(--line-strong); background: linear-gradient(var(--surface), var(--head-bottom)); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 1px 2px rgba(40,32,15,.12); font-weight: 600; color: var(--fg); }
  .unit { font-size: 13px; font-weight: 600; color: var(--mute); min-width: 24px; }
  textarea { width: 100%; }
  .link { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 6px 2px; min-height: 32px; font-size: 13px; }
  input[type=text], input[type=search], input[type=password], select, textarea { border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; background: var(--surface); box-shadow: var(--sh-field); min-width: 0; min-height: 44px; font-size: 14px; }
  input[type=text], input[type=search], input[type=password] { width: 100%; }
  label.f { display: block; font-size: 12.5px; color: var(--ink2); margin: 12px 0 4px; font-weight: 600; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--sunk); color: var(--mute); white-space: nowrap; border: 1px solid var(--line); }
  .badge.open, .badge.plus { background: var(--out-bg); color: var(--out-ink); border-color: var(--out-line); }
  .badge.sub { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft-line); }
  .badge.app, .badge.good { background: var(--in-bg); color: var(--in-ink); border-color: var(--in-line); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
  :root[data-theme="dark"] .badge.sub { color: #ffd889; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .stat { flex: 1 1 120px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
  .stat .small { font-size: 12px; }
  .stat b { display: block; font-size: 18px; font-weight: 700; line-height: 1.3; }
  @media (max-width: 860px) {
    .stats { flex-wrap: nowrap; gap: 6px; margin-top: 10px; }
    .stat { flex: 1 1 0; min-width: 0; padding: 5px 8px; border-radius: 8px; background: var(--sunk); }
    .stat { padding: 5px 6px; }
    .stat .small { display: block; font-size: 10.5px; line-height: 1.25; }
    .stat b { font-size: 15px; line-height: 1.25; white-space: nowrap; }
    .stat .bar { height: 4px; margin-top: 3px; }
  }
  .xmenu { position: relative; display: inline-flex; }
  .xpop { position: absolute; left: 0; top: calc(100% + 6px); z-index: 35; min-width: 220px; padding: 4px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--sh-dialog); display: flex; flex-direction: column; gap: 2px; }
  .xpop button { display: flex; flex-direction: column; align-items: flex-start; gap: 0; width: 100%; min-height: 44px; padding: 6px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; color: var(--fg); }
  .xpop button:hover, .xpop button:focus-visible { background: var(--accent-soft); }
  .xpop button b { font-size: 13.5px; font-weight: 600; }
  .xpop button span { font-size: 12px; color: var(--mute); }
  #toTop { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(72px + env(safe-area-inset-bottom, 0px)); z-index: 40; width: 44px; height: 44px; border-radius: 50%; padding: 0; display: grid; place-items: center; }
  #toTop svg.i { width: 20px; height: 20px; }
  @media (min-width: 861px) { #toTop { bottom: 24px; right: 24px; width: 40px; height: 40px; } }
  .bar { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #c9a646, #e2c677); transition: width .2s; }
  .toolbar { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin: 0 0 12px; }
  .toolbar select { width: 100%; }
  @media (min-width: 861px) {
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
    .toolbar .q { flex: 1 1 220px; }

    .toolbar .q { width: auto; }

  }
  .grp { margin: 14px 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--fg); }
  .grp .muted { font-weight: 600; }

  /* thẻ đếm (điện thoại) */
  div.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; box-shadow: var(--sh-panel); }
  div.item.done { border-color: var(--in-line); }
  div.item.diff { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); background: color-mix(in srgb, var(--bad-soft) 40%, var(--surface)); }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .kr { font-size: 11.5px; color: var(--mute); overflow-wrap: anywhere; }
  .tag { font-size: 11.5px; color: var(--mute); }
  .ctl { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .stepper { display: inline-flex; align-items: stretch; border: 1px solid var(--line-strong); border-bottom-color: var(--line-shade); border-radius: 8px; overflow: hidden; box-shadow: var(--sh-btn); }
  .stepper button { width: 44px; min-height: 44px; border: 0; background: linear-gradient(var(--surface), var(--btn-bottom)); font-size: 20px; line-height: 1; color: var(--ink2); }

  .stepper .qty-in { width: 64px; min-height: 44px; text-align: center; border: 1px dashed var(--cell-input-line); border-width: 0 1px; border-radius: 0; font-size: 18px; font-weight: 700; padding: 0 4px; background: var(--cell-input); box-shadow: none; }
  .item.done .qty-in, .item.diff .qty-in, .qty-in.has { background: var(--accent-soft); border-style: solid; border-color: var(--accent-soft-line); }
  :root[data-theme="dark"] div.item.done .qty-in, :root[data-theme="dark"] div.item.diff .qty-in { color: #ececee; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) div.item.done .qty-in, :root:not([data-theme="light"]) div.item.diff .qty-in { color: #ececee; } }
  .cond { flex: 1; min-width: 130px; font-size: 13px; }
  .meta { font-size: 11.5px; color: var(--mute); margin-top: 6px; }
  .meta:empty { display: none; }
  .note-row { margin-top: 8px; }
  .figs { text-align: right; font-size: 12.5px; white-space: nowrap; color: var(--ink2); }
  .figs b { font-size: 14px; }

  /* bảng đếm (máy tính) */
  .kkwrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--sh-panel); overflow-x: auto; }
  table.kk { width: 100%; min-width: 760px; border-collapse: collapse; font-size: 14px; background: var(--table-bg); color: var(--table-ink); }
  table.kk th { padding: 6px 8px; font-size: 12px; font-weight: 700; text-align: left; color: var(--fg); background: linear-gradient(var(--head-top), var(--head-bottom)); border-bottom: 1px solid var(--line-strong); border-right: 1px solid var(--line); white-space: nowrap; }
  table.kk th.gin { background: var(--in-bg); color: var(--in-ink); border-bottom-color: var(--in-line); letter-spacing: .03em; text-align: center; }
  table.kk th.gout { background: var(--out-bg); color: var(--out-ink); border-bottom-color: var(--out-line); letter-spacing: .03em; text-align: center; }
  table.kk th.sin { background: var(--in-sub); color: var(--fg); }
  table.kk th.sout { background: var(--out-sub); color: var(--fg); }
  table.kk td { padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  :root[data-theme="dark"] table.kk td { border-bottom-color: #a5a5a5; }
  table.kk td.cin { background: var(--in-cell); }
  table.kk td.cout { background: var(--out-cell); text-align: right; }
  table.kk tr.tot td { font-weight: 700; padding: 6px 8px; border-bottom: 3px double var(--total-rule); }
  table.kk tr.grp td { padding: 5px 12px; background: var(--group-row); color: var(--group-ink); font-size: 12px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; border-top: 1px solid var(--line); }
  table.kk tr.grp td .muted { color: inherit; opacity: .65; }
  table.kk tr.item.diff td:not(.cin):not(.cout) { background: var(--bad-row); }
  table.kk td.nm { padding-left: 12px; min-width: 220px; }
  table.kk .meta { margin: 0; white-space: nowrap; }
  table.kk td.nm .kr { display: inline; margin-left: 4px; }
  table.kk .kr, table.kk .tag, table.kk .meta, table.kk .muted { color: color-mix(in srgb, var(--table-ink) 58%, transparent); }
  table.kk .qty-in { width: 76px; height: 26px; min-height: 26px; text-align: right; padding: 0 6px; border-radius: 6px; font-size: 14px; background: var(--cell-input); border: 1px dashed var(--cell-input-line); box-shadow: var(--sh-field); }
  table.kk tr.done .qty-in, table.kk tr.diff .qty-in { background: #f6efd9; border: 1px solid #d7c79c; color: #1c1b19; }
  table.kk select.cond, table.kk .note-in { min-height: 26px; height: 26px; padding: 0 6px; font-size: 13px; width: 100%; min-width: 120px; border-radius: 6px; background: #ffffff; color: #1c1b19; border-color: #d7d3ca; }
  table.kk .dpos, table.kk .dneg { font-weight: 700; color: #b42318; }
  table.kk .dzero { color: #1d7a4b; }
  table.kk .dnone { font-size: 12px; color: color-mix(in srgb, var(--table-ink) 58%, transparent); }
  table.kk .lnk { background: none; border: 0; color: #b42318; font-size: 12px; font-weight: 600; padding: 0 4px; }

  /* bảng chung */
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--fg); font-weight: 700; background: linear-gradient(var(--head-top), var(--head-bottom)); border-bottom-color: var(--line-strong); }
  td.grp { background: var(--group-row); color: var(--group-ink); padding: 5px 8px; margin: 0; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tablewrap { overflow-x: auto; }
  .card.tablewrap { padding: 0; }
  .card.tablewrap td .btn { min-height: 28px; }

  /* chọn cửa hàng */
  .stores { display: grid; gap: 10px; max-width: 560px; }
  .store { display: flex; align-items: center; gap: 12px; padding: 12px; min-height: 64px; width: 100%; text-align: left; border-radius: 12px; border: 1px solid var(--line-strong); border-bottom-color: var(--line-shade); background: linear-gradient(var(--surface), var(--btn-bottom)); box-shadow: var(--sh-btn); color: var(--fg); }
  .store svg.i { width: 22px; height: 22px; color: var(--mute); }
  .store.open svg.i.shop { color: var(--accent); }
  .store svg.i.chev, .store svg.i.lk { width: 16px; height: 16px; }
  .store .nm { display: block; font-weight: 600; font-size: 14px; }
  .store .st { font-size: 12px; color: var(--mute); }
  .store.open .st { color: var(--ok); }
  .ownerbox { max-width: 560px; margin-top: 12px; }

  /* hộp thoại, thông báo */
  .modal { position: fixed; inset: 0; background: rgba(17,18,19,.55); display: flex; align-items: flex-start; justify-content: center; z-index: 50; padding: max(56px, calc(env(safe-area-inset-top, 0px) + 40px)) 16px 16px; overflow-y: auto; }
  .modal .card { width: 100%; max-width: 460px; max-height: 90vh; overflow: auto; margin: 0; border-color: var(--line-strong); border-radius: 14px; box-shadow: var(--sh-dialog); padding: 14px 16px; }
  .modal .card > .row:last-child { margin: 16px -16px -14px !important; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--head-top); }
  @media (min-width: 560px) { .modal { padding-top: 12vh; } }
  #toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 60; max-width: 90vw; font-size: 13px; box-shadow: var(--sh-dialog); }
  @media (min-width: 861px) { #toast { bottom: 24px; } }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
  /* Điện thoại tự phóng to khi bấm vào ô nhập có chữ dưới 16px: giữ mọi ô nhập từ 16px trở lên */
  @media (max-width: 860px) { input[type=text], input[type=search], input[type=password], input[type=number], select, textarea, select.cond, .note-in { font-size: 16px; } .stepper .qty-in { font-size: 18px; } }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

      }).catch(fail).then(function () { var x = $('bkOut'); if (x) { x.disabled = false; x.textContent = 'Tải file sao lưu'; } });
    };
    $('bkFile').onchange = function () {
      var f = this.files && this.files[0], info = $('bkInfo'); parsed = null; $('bkIn').disabled = true; info.style.color = '';
      if (!f) { info.textContent = ''; return; }
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var j = JSON.parse(rd.result);
          if (!j || j.format !== 'kiem-ke-foremost' || !j.docs) throw new Error('fmt');
          var paths = Object.keys(j.docs).filter(function (p) { return p.split('/').length % 2 === 0; });
          if (!paths.length) throw new Error('empty');
          parsed = { docs: j.docs, paths: paths };
          var n = function (re) { return paths.filter(function (p) { return re.test(p); }).length; };
          info.textContent = 'File có ' + paths.length + ' mục: ' + n(/_(catalog|nl_catalog)\//) + ' danh mục, ' + n(/_(book|nl_book)\//) + ' sổ sách, ' + n(/_sessions\/[^/]+$/) + ' đợt, ' + n(/\/counts\//) + ' số đếm' + (j.docs['gate/main'] ? ', mật khẩu cửa hàng' : '') + '.';
          $('bkIn').disabled = false;
        } catch (e) { info.style.color = 'var(--bad)'; info.textContent = 'File này không phải file dữ liệu kiểm kê.'; }
      };
      rd.readAsText(f);
    };
    $('bkIn').onclick = function () {
      if (!parsed) return;
      var b = $('bkIn');
      if (b.getAttribute('data-sure') !== '1') { b.setAttribute('data-sure', '1'); b.textContent = 'Bấm lần nữa để ghi ' + parsed.paths.length + ' mục'; return; }
      b.disabled = true; b.textContent = 'Đang nhập…';
      var chunks = [], i;
      for (i = 0; i < parsed.paths.length; i += 400) chunks.push(parsed.paths.slice(i, i + 400));
      chunks.reduce(function (p, ch) {
        return p.then(function () { var bt = S.db.batch(); ch.forEach(function (path) { bt.set(S.db.doc(path), parsed.docs[path]); }); return bt.commit(); });
      }, Promise.resolve()).then(function () { closeModal(); toast('Đã nhập ' + parsed.paths.length + ' mục dữ liệu', 5000); })
        .catch(function (e) { var x = $('bkIn'); if (x) { x.disabled = false; x.removeAttribute('data-sure'); x.textContent = 'Nhập dữ liệu'; } fail(e); });
    };
  }

  init();
})();
</script>

</body></html>
